name: Cypress Tests Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes Cypress em Headless
        uses: cypress-io/github-action@v6
        with:
          browser: chrome

      - name: Salvar Artefatos (Relatório e Evidências)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-execution-report
          path: |
            cypress/reports
            cypress/screenshots
            cypress/videos
          retention-days: 7